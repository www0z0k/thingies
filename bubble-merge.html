<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>Fusion Bubble Merge</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      margin: 0; 
      padding: 0;
      overflow: hidden;
      background: #111;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      height: 100vh;
      height: 100dvh; /* Новая единица для мобильных браузеров */
      width: 100vw;
      position: fixed;
      top: 0;
      left: 0;
    }
    
    canvas {
      display: block;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    
    #hud {
      position: absolute;
      top: env(safe-area-inset-top, 10px);
      left: env(safe-area-inset-left, 10px);
      right: env(safe-area-inset-right, 10px);
      z-index: 10;
      font-size: clamp(12px, 3vw, 18px);
      font-weight: 600;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      pointer-events: none;
      padding: 8px 12px;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    
    #gameOver {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.9);
      padding: clamp(15px, 5vw, 30px);
      border-radius: clamp(8px, 2vw, 15px);
      text-align: center;
      display: none;
      z-index: 20;
      max-width: 90vw;
      max-height: 80vh;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 2px solid rgba(255,255,255,0.1);
    }
    
    #gameOver h2 {
      margin: 0 0 clamp(10px, 3vw, 20px) 0;
      font-size: clamp(18px, 5vw, 28px);
      font-weight: 700;
    }
    
    #gameOver p {
      margin: clamp(5px, 2vw, 10px) 0;
      font-size: clamp(14px, 3.5vw, 18px);
    }
    
    #gameOver button {
      margin-top: clamp(15px, 4vw, 25px);
      padding: clamp(12px, 3vw, 18px) clamp(20px, 6vw, 35px);
      font-size: clamp(14px, 4vw, 18px);
      background: #4682b4;
      color: white;
      border: none;
      border-radius: clamp(5px, 1.5vw, 8px);
      cursor: pointer;
      font-weight: 600;
      min-height: 44px; /* Минимальный размер для touch target */
      min-width: 120px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(70, 130, 180, 0.3);
    }
    
    #gameOver button:hover,
    #gameOver button:focus {
      background: #5a9bd4;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(70, 130, 180, 0.4);
    }
    
    #gameOver button:active {
      transform: translateY(0);
      box-shadow: 0 2px 10px rgba(70, 130, 180, 0.3);
    }
    
    /* Дополнительные стили для очень маленьких экранов */
    @media (max-height: 500px) {
      #gameOver {
        padding: 15px;
        max-height: 90vh;
        overflow-y: auto;
      }
      
      #gameOver h2 {
        font-size: clamp(16px, 4vw, 22px);
        margin-bottom: 10px;
      }
      
      #gameOver p {
        font-size: clamp(12px, 3vw, 16px);
        margin: 5px 0;
      }
    }
    
    /* Ландшафтная ориентация на мобильных */
    @media (orientation: landscape) and (max-height: 500px) {
      #hud {
        font-size: clamp(10px, 2.5vw, 16px);
        padding: 6px 10px;
      }
      
      #gameOver {
        max-width: 60vw;
        max-height: 85vh;
      }
    }
    
    /* Стили для планшетов */
    @media (min-width: 768px) and (max-width: 1024px) {
      #hud {
        font-size: clamp(16px, 2.5vw, 20px);
        padding: 10px 15px;
      }
      
      #gameOver {
        max-width: 70vw;
        padding: clamp(20px, 4vw, 35px);
      }
    }
    
    /* Стили для больших экранов */
    @media (min-width: 1025px) {
      #hud {
        font-size: 18px;
        padding: 12px 18px;
      }
      
      #gameOver {
        max-width: 400px;
        padding: 30px;
      }
    }
    
    /* Поддержка iPhone с вырезом */
    @supports (padding-top: env(safe-area-inset-top)) {
      #hud {
        padding-top: calc(env(safe-area-inset-top) + 8px);
        padding-left: calc(env(safe-area-inset-left) + 10px);
        padding-right: calc(env(safe-area-inset-right) + 10px);
      }
    }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="hud">Fusion Bubble Merge</div>
<div id="gameOver">
  <h2>Игра окончена!</h2>
  <p>Экран заполнен пузырями</p>
  <p id="finalScore">Финальный счет: 0</p>
  <button onclick="restartGame()">Начать заново</button>
</div>

<script>
let score = 0;
let gameOver = false;
let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
let isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
let devicePixelRatio = window.devicePixelRatio || 1;

// Адаптивные константы в зависимости от устройства
const MAX_BUBBLES = isMobile ? 35 : 50; // Меньше пузырей на мобильных
const PUSH_FORCE = isMobile ? 0.4 : 0.3; // Больше сила на мобильных для удобства
const FRICTION = isMobile ? 0.93 : 0.95; // Немного больше трение на мобильных
const MIN_VELOCITY = isMobile ? 0.15 : 0.1; // Чуть выше порог остановки на мобильных

const setScore = (val) => {
  const text = isMobile 
    ? `Score: ${val}<br>Bubbles: ${bubbles.length}/${MAX_BUBBLES}<br>FPS: ${fpsCounter}`
    : `Fusion Bubble Merge | Score: ${val} | Bubbles: ${bubbles.length}/${MAX_BUBBLES} | FPS: ${fpsCounter}`;
  document.getElementById('hud').innerHTML = text;
};

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Функция для получения реального размера экрана с учетом мобильных браузеров
function getScreenDimensions() {
  let W, H;
  
  if (isMobile) {
    // Для мобильных устройств используем visual viewport если доступен
    if (window.visualViewport) {
      W = window.visualViewport.width;
      H = window.visualViewport.height;
    } else {
      W = window.innerWidth;
      H = window.innerHeight;
      
      // Корректировка для iOS Safari
      if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        H = window.screen.height;
        if (window.orientation === 0 || window.orientation === 180) {
          H = Math.min(window.screen.height, window.innerHeight);
        }
      }
    }
  } else {
    W = window.innerWidth;
    H = window.innerHeight;
  }
  
  return { W, H };
}

let { W, H } = getScreenDimensions();

// Настройка canvas с учетом высокого DPI
function setupCanvas() {
  const { W: newW, H: newH } = getScreenDimensions();
  W = newW;
  H = newH;
  
  // Устанавливаем CSS размеры
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  
  // Устанавливаем внутренние размеры с учетом DPI
  canvas.width = W * devicePixelRatio;
  canvas.height = H * devicePixelRatio;
  
  // Масштабируем контекст
  ctx.scale(devicePixelRatio, devicePixelRatio);
}

setupCanvas();

const colors = {
  2: '#eee', 4: '#add8e6', 8: '#87cefa', 16: '#4682b4', 32: '#f08080',
  64: '#f06', 128: '#fa0', 256: '#ff0', 512: '#0f0', 1024: '#0ff', 2048: '#fff',
  4096: '#c0c0c0', 8192: '#f00', 16384: '#800080', 32768: '#808080', 65536: '#f0f'
};

let bubbles = [];
let dragging = null;
let pushStart = null;
let pushDirection = { x: 0, y: 0 };
let pushForce = 0;

const getBaseRadiusBasedOnScreenSize = () => {
  // Адаптивный размер пузырей в зависимости от устройства
  let divisor;
  
  if (isMobile) {
    // На мобильных пузыри больше для удобства тапов
    divisor = Math.min(W, H) < 400 ? 12 : 15; // Очень маленькие экраны получают ещё больше пузыри
  } else {
    divisor = 20; // Стандартный размер для десктопа
  }
  
  const baseRadius = Math.min(W, H) / divisor;
  return Math.max(baseRadius, 15); // Минимальный размер пузыря 15px
};

// Функция для расчета веса пузыря на основе его значения
function getBubbleWeight(value) {
  return Math.log2(value) * 0.5 + 1; // Больше значение = больше вес
}

// Функция для расчета массы пузыря (влияет на инерцию)
function getBubbleMass(value) {
  return Math.log2(value) * 0.3 + 0.5;
}

function spawnBubble(x, y, value = 2) {
  const br = getBaseRadiusBasedOnScreenSize();
  let radius = br + Math.log2(value) * (br / 3);
  const weight = getBubbleWeight(value);
  const mass = getBubbleMass(value);
  
  // Убеждаемся, что пузырь спавнится в границах экрана
  x = Math.max(radius, Math.min(W - radius, x));
  y = Math.max(radius, Math.min(H - radius, y));
  
  bubbles.push({ 
    x, y, vx: 0, vy: 0, radius, value, 
    weight, mass, merged: false, 
    lastCollision: 0 // Для предотвращения мгновенных повторных слияний
  });
}

// Функция для принудительного удержания всех пузырей в границах
function constrainBubblesToScreen() {
  bubbles.forEach(bubble => {
    bubble.x = Math.max(bubble.radius, Math.min(W - bubble.radius, bubble.x));
    bubble.y = Math.max(bubble.radius, Math.min(H - bubble.radius, bubble.y));
  });
}

function spawnInitialBubbles() {
  // Сохраняем существующий прогресс если есть
  if (bubbles.length > 0) {
    return; // Не перезапускаем если игра уже идет
  }
  
  bubbles = [];
  const values = [];
  
  // Адаптивное количество начальных пузырей
  let numBubbles;
  if (isMobile) {
    // Меньше пузырей на мобильных для лучшей производительности
    numBubbles = Math.floor(Math.random() * 6) + 5; 
  } else {
    numBubbles = Math.floor(Math.random() * 10) + 8;
  }
  
  for (let i = 0; i < numBubbles; i++) {
    let val = Math.random() < 0.6 ? 2 : (Math.random() < 0.7 ? 4 : 8);
    values.push(val);
  } 
  
  // Адаптивные отступы от краев
  const marginX = isMobile ? 80 : 100;
  const marginY = isMobile ? 120 : 100; // Больше отступ сверху на мобильных для HUD
  
  for (let val of values) {
    let x = Math.random() * (W - marginX * 2) + marginX;
    let y = Math.random() * (H - marginY * 2) + marginY;
    spawnBubble(x, y, val);
  }
  setScore(score);
}

// Кэшируем градиенты для лучшей производительности
const gradientCache = new Map();

function drawBubble(b) {
  // Основной круг пузыря
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
  ctx.fillStyle = colors[b.value] || '#fff';
  ctx.fill();
  
  // Добавляем градиент только в режиме высокого качества
  if (!lowFPSMode) {
    const gradientKey = `${Math.round(b.radius)}-${b.value}`;
    let gradient = gradientCache.get(gradientKey);
    
    if (!gradient) {
      gradient = ctx.createRadialGradient(
        0, 0, 0,
        0, 0, b.radius
      );
      gradient.addColorStop(0, 'rgba(255,255,255,0.3)');
      gradient.addColorStop(1, 'rgba(0,0,0,0.1)');
      gradientCache.set(gradientKey, gradient);
    }
    
    // Применяем градиент с учетом позиции
    ctx.save();
    ctx.translate(b.x - b.radius/3, b.y - b.radius/3);
    ctx.beginPath();
    ctx.arc(b.radius/3, b.radius/3, b.radius, 0, Math.PI * 2);
    ctx.fillStyle = gradient;
    ctx.fill();
    ctx.restore();
  }
  
  // Оптимизированная обводка
  const strokeWidth = isMobile ? Math.max(1, b.radius * 0.05) : 2;
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = strokeWidth;
  ctx.stroke();
  
  // Оптимизированный текст
  const fontSize = isMobile ? 
    Math.max(10, b.radius * 0.5) : 
    Math.max(12, b.radius * 0.6);
  
  ctx.fillStyle = '#000';
  ctx.font = `bold ${fontSize}px ${isMobile ? '-apple-system' : 'sans-serif'}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(b.value, b.x, b.y);
}

function distance(b1, b2) {
  let dx = b1.x - b2.x;
  let dy = b1.y - b2.y;
  return Math.sqrt(dx * dx + dy * dy);
}

function mergeBubbles(b1, b2) {
  const now = Date.now();
  
  // Предотвращаем слишком быстрые повторные слияния
  if (now - b1.lastCollision < 100 || now - b2.lastCollision < 100) {
    return false;
  }
  
  b1.value *= 2;
  score += b1.value * 10;
  setScore(score);
  
  const br = getBaseRadiusBasedOnScreenSize();
  b1.radius = br + Math.log2(b1.value) * (br / 3);
  b1.weight = getBubbleWeight(b1.value);
  b1.mass = getBubbleMass(b1.value);
  
  // Сохраняем импульс с учетом массы
  const totalMass = b1.mass + b2.mass;
  b1.vx = (b1.vx * b1.mass + b2.vx * b2.mass) / totalMass;
  b1.vy = (b1.vy * b1.mass + b2.vy * b2.mass) / totalMass;
  
  b1.lastCollision = now;
  b2.merged = true;

  // Эффект слияния
  for (let i = 0; i < 8; i++) {
    setTimeout(() => {
      if (!gameOver) {
        ctx.beginPath();
        ctx.arc(b1.x, b1.y, b1.radius + i * 3, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255,255,255,${1 - i / 8})`;
        ctx.lineWidth = 3;
        ctx.stroke();
      }
    }, i * 40);
  }
  
  return true;
}

function checkGameOver() {
  if (bubbles.length >= MAX_BUBBLES) {
    gameOver = true;
    document.getElementById('finalScore').textContent = `Финальный счет: ${score}`;
    document.getElementById('gameOver').style.display = 'block';
    return true;
  }
  return false;
}

function restartGame() {
  gameOver = false;
  score = 0;
  bubbles = [];
  dragging = null;
  pushStart = null;
  document.getElementById('gameOver').style.display = 'none';
  spawnInitialBubbles();
}

function hasAvailableMerges() {
  for (let i = 0; i < bubbles.length; i++) {
    for (let j = i + 1; j < bubbles.length; j++) {
      if (bubbles[i].value === bubbles[j].value && 
          distance(bubbles[i], bubbles[j]) < bubbles[i].radius + bubbles[j].radius + 50) {
        return true;
      }
    }
  }
  return false;
}

function update() {
  if (gameOver) return;
  
  const now = Date.now();
  const bubbleCount = bubbles.length;
  
  // Оптимизированный цикл обновления позиций
  for (let i = 0; i < bubbleCount; i++) {
    const b = bubbles[i];
    if (b !== dragging) {
      // Применяем трение для затухания движения
      b.vx *= FRICTION;
      b.vy *= FRICTION;
      
      // Останавливаем очень медленные движения (оптимизация)
      const absVx = Math.abs(b.vx);
      const absVy = Math.abs(b.vy);
      if (absVx < MIN_VELOCITY) b.vx = 0;
      if (absVy < MIN_VELOCITY) b.vy = 0;
      
      // Обновляем позицию только если есть движение
      if (absVx > 0 || absVy > 0) {
        b.x += b.vx;
        b.y += b.vy;

        // Строгие границы экрана - оптимизированная проверка
        const radius = b.radius;
        if (b.x <= radius) {
          b.x = radius;
          b.vx = absVx * 0.7; // Отскок в положительном направлении
        } else if (b.x >= W - radius) {
          b.x = W - radius;
          b.vx = -absVx * 0.7; // Отскок в отрицательном направлении
        }
        
        if (b.y <= radius) {
          b.y = radius;
          b.vy = absVy * 0.7; // Отскок вниз
        } else if (b.y >= H - radius) {
          b.y = H - radius;
          b.vy = -absVy * 0.7; // Отскок вверх
        }
      }
    }
  }

  // Оптимизированная обработка столкновений и слияний
  for (let i = 0; i < bubbleCount; i++) {
    const b1 = bubbles[i];
    if (b1.merged) continue;
    
    for (let j = i + 1; j < bubbleCount; j++) {
      const b2 = bubbles[j];
      if (b2.merged) continue;
      
      // Быстрая проверка расстояния без sqrt
      const dx = b2.x - b1.x;
      const dy = b2.y - b1.y;
      const distanceSquared = dx * dx + dy * dy;
      const minDistance = b1.radius + b2.radius;
      const minDistanceSquared = minDistance * minDistance;
      
      if (distanceSquared < minDistanceSquared) {
        // Проверяем возможность слияния
        if (b1.value === b2.value) {
          // Слияние происходит при контакте пузырей одинакового значения
          mergeBubbles(b1, b2);
          continue;
        }
        
        // Физика столкновения с учетом массы и веса
        const distance = Math.sqrt(distanceSquared);
        const angle = Math.atan2(dy, dx);
        const overlap = minDistance - distance;
        
        // Разделяем пузыри
        const separationForce = overlap * 0.5;
        const pushX = Math.cos(angle) * separationForce;
        const pushY = Math.sin(angle) * separationForce;
        
        // Учитываем массу при разделении (кэшируем вычисления)
        const totalMass = b1.mass + b2.mass;
        const b1Factor = b2.mass / totalMass;
        const b2Factor = b1.mass / totalMass;
        
        b1.x -= pushX * b1Factor;
        b1.y -= pushY * b1Factor;
        b2.x += pushX * b2Factor;
        b2.y += pushY * b2Factor;
        
        // Передача импульса с учетом массы и веса
        const impactForce = 0.1 / Math.max(b1.weight, b2.weight);
        const impulseX = pushX * impactForce;
        const impulseY = pushY * impactForce;
        
        b1.vx -= impulseX * b1Factor;
        b1.vy -= impulseY * b1Factor;
        b2.vx += impulseX * b2Factor;
        b2.vy += impulseY * b2Factor;
      }
    }
  }

  // Удаляем слившиеся пузыри (оптимизированно)
  let writeIndex = 0;
  for (let i = 0; i < bubbleCount; i++) {
    if (!bubbles[i].merged) {
      if (writeIndex !== i) {
        bubbles[writeIndex] = bubbles[i];
      }
      writeIndex++;
    }
  }
  bubbles.length = writeIndex;
  
  // Финальная проверка границ для всех пузырей
  for (let i = 0; i < bubbles.length; i++) {
    const b = bubbles[i];
    b.x = Math.max(b.radius, Math.min(W - b.radius, b.x));
    b.y = Math.max(b.radius, Math.min(H - b.radius, b.y));
  }
  
  // Проверяем условие поражения
  checkGameOver();
}

function draw() {
  // Оптимизированная очистка canvas
  ctx.clearRect(0, 0, W, H);
  
  // Рисуем пузыри сначала (batch rendering)
  const bubbleCount = bubbles.length;
  for (let i = 0; i < bubbleCount; i++) {
    if (!bubbles[i].merged) {
      drawBubble(bubbles[i]);
    }
  }
  
  // Рисуем направление толчка (рогатка) поверх пузырей
  if (dragging && pushStart && pushForce > 0) {
    ctx.save(); // Сохраняем состояние контекста
    
    // Линия от пузыря к точке оттягивания
    ctx.beginPath();
    ctx.moveTo(dragging.x, dragging.y);
    ctx.lineTo(pushStart.x, pushStart.y);
    ctx.strokeStyle = `rgba(255, 255, 255, 0.6)`;
    ctx.lineWidth = 3;
    ctx.stroke();
    
    // Стрелка показывающая направление полета (оптимизированная)
    const dirLength = Math.sqrt(pushDirection.x * pushDirection.x + pushDirection.y * pushDirection.y);
    if (dirLength > 0) {
      const arrowLength = pushForce * 20;
      const normalizedX = pushDirection.x / dirLength;
      const normalizedY = pushDirection.y / dirLength;
      const arrowEndX = dragging.x + normalizedX * arrowLength;
      const arrowEndY = dragging.y + normalizedY * arrowLength;
      
      ctx.beginPath();
      ctx.moveTo(dragging.x, dragging.y);
      ctx.lineTo(arrowEndX, arrowEndY);
      ctx.strokeStyle = `rgba(255, 100, 100, ${0.5 + pushForce * 0.1})`;
      ctx.lineWidth = 4;
      ctx.stroke();
    }
    
    // Точка оттягивания
    ctx.beginPath();
    ctx.arc(pushStart.x, pushStart.y, 8, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 100, 100, 0.7)`;
    ctx.fill();
    
    // Индикатор силы на пузыре
    ctx.beginPath();
    ctx.arc(dragging.x, dragging.y, dragging.radius + 3 + pushForce * 2, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255, 200, 100, ${0.4 + pushForce * 0.1})`;
    ctx.lineWidth = 2;
    ctx.stroke();
    
    ctx.restore(); // Восстанавливаем состояние контекста
  }
  
  // Предупреждение о близости к поражению
  if (bubbles.length > MAX_BUBBLES * 0.8) {
    ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.fillStyle = '#ff0000';
    
    // Адаптивный размер шрифта для предупреждения
    const warningFontSize = isMobile ? 
      Math.min(Math.max(16, W * 0.04), 20) : 24;
    
    ctx.font = `bold ${warningFontSize}px ${isMobile ? '-apple-system, system-ui' : 'sans-serif'}`;
    ctx.textAlign = 'center';
    
    // Адаптивная позиция предупреждения
    const warningY = isMobile ? 80 : 50;
    
    if (isMobile) {
      ctx.fillText('ВНИМАНИЕ!', W/2, warningY);
      ctx.fillText('Экран почти заполнен!', W/2, warningY + warningFontSize + 5);
    } else {
      ctx.fillText('ВНИМАНИЕ! Экран почти заполнен!', W/2, warningY);
    }
  }
}

// Оптимизация для стабильных 60+ FPS
let lastTime = 0;
let deltaTime = 0;
const targetFPS = 60;
const targetFrameTime = 1000 / targetFPS;
let frameCount = 0;
let fpsCounter = 0;
let lastFPSTime = 0;
let lowFPSMode = false; // Режим низкого качества для поддержания FPS

function loop(currentTime) {
  if (!gameOver) {
    // Ограничиваем частоту кадров для стабильности
    deltaTime = currentTime - lastTime;
    
    if (deltaTime >= targetFrameTime) {
      // Счетчик FPS и адаптивное качество
      frameCount++;
      if (currentTime - lastFPSTime >= 1000) {
        fpsCounter = frameCount;
        frameCount = 0;
        lastFPSTime = currentTime;
        
        // Включаем режим низкого качества если FPS падает ниже 45
        lowFPSMode = fpsCounter < 45;
        
        // Очищаем кэш градиентов периодически для экономии памяти
        if (gradientCache.size > 100) {
          gradientCache.clear();
        }
      }
      
      update();
      draw();
      
      lastTime = currentTime - (deltaTime % targetFrameTime);
    }
    
    requestAnimationFrame(loop);
  }
}

function getPos(evt) {
  const rect = canvas.getBoundingClientRect();
  let clientX, clientY;
  
  if (evt.touches && evt.touches.length > 0) {
    clientX = evt.touches[0].clientX;
    clientY = evt.touches[0].clientY;
  } else if (evt.changedTouches && evt.changedTouches.length > 0) {
    clientX = evt.changedTouches[0].clientX;
    clientY = evt.changedTouches[0].clientY;
  } else {
    clientX = evt.clientX;
    clientY = evt.clientY;
  }
  
  // Учитываем масштабирование canvas
  const scaleX = canvas.width / (rect.width * devicePixelRatio);
  const scaleY = canvas.height / (rect.height * devicePixelRatio);
  
  return {
    x: (clientX - rect.left) * scaleX / devicePixelRatio,
    y: (clientY - rect.top) * scaleY / devicePixelRatio
  };
}

function startDrag(e) {
  if (gameOver) return;
  
  const { x, y } = getPos(e);
  for (let b of bubbles) {
    if (distance({ x, y }, b) < b.radius) {
      dragging = b;
      pushStart = { x, y }; // Запоминаем точку начала касания
      break;
    }
  }
}

function moveDrag(e) {
  if (dragging && pushStart) {
    const { x, y } = getPos(e);
    // Вектор от текущей позиции мыши к пузырю (обратное направление для рогатки)
    pushDirection.x = pushStart.x - x;
    pushDirection.y = pushStart.y - y;
    pushForce = Math.min(distance(pushStart, { x, y }) / 30, 8); // Увеличили максимальную силу
  }
}

function endDrag() {
  if (dragging && pushStart && pushForce > 0.5) { // Минимальная сила для выстрела
    // Нормализуем направление
    const directionLength = distance({ x: 0, y: 0 }, pushDirection);
    if (directionLength > 0) {
      const normalizedX = pushDirection.x / directionLength;
      const normalizedY = pushDirection.y / directionLength;
      
      // Применяем толчок с учетом веса пузыря
      const forceMultiplier = (PUSH_FORCE * pushForce) / dragging.weight;
      dragging.vx = normalizedX * forceMultiplier;
      dragging.vy = normalizedY * forceMultiplier;
    }
    
    // Адаптивное добавление новых пузырей
    const spawnChance = isMobile ? 0.2 : 0.3; // Реже на мобильных
    const maxNewBubbles = isMobile ? 1 : 2; // Меньше на мобильных
    
    if (Math.random() < spawnChance && bubbles.length < MAX_BUBBLES - 3) {
      const quantity = Math.floor(Math.random() * maxNewBubbles) + 1;
      
      // Адаптивные отступы
      const marginX = isMobile ? 80 : 100;
      const marginY = isMobile ? 120 : 100;
      
      for (let i = 0; i < quantity; i++) {
        let x = Math.random() * (W - marginX * 2) + marginX;
        let y = Math.random() * (H - marginY * 2) + marginY;
        spawnBubble(x, y, Math.random() < 0.7 ? 2 : 4);
      }
    }
  }
  
  dragging = null;
  pushStart = null;
  pushDirection = { x: 0, y: 0 };
  pushForce = 0;
}

// Обработчики мыши для десктопа
if (!isTouch) {
  canvas.addEventListener('mousedown', startDrag);
  canvas.addEventListener('mousemove', moveDrag);
  canvas.addEventListener('mouseup', endDrag);
  canvas.addEventListener('mouseleave', endDrag); // Завершаем тащение при выходе за пределы
}

// Обработчики касаний для мобильных
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault(); // Предотвращаем зум и прокрутку
  startDrag(e);
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault(); // Предотвращаем прокрутку страницы
  moveDrag(e);
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  endDrag();
}, { passive: false });

canvas.addEventListener('touchcancel', (e) => {
  e.preventDefault();
  endDrag();
}, { passive: false });

// Предотвращение контекстного меню на касаниях
canvas.addEventListener('contextmenu', (e) => {
  e.preventDefault();
});

// Предотвращение double-tap zoom на iOS
let lastTouchTime = 0;
canvas.addEventListener('touchstart', (e) => {
  const now = Date.now();
  if (now - lastTouchTime < 300) {
    e.preventDefault();
  }
  lastTouchTime = now;
});

// Обработчик изменения размера и ориентации
function handleResize() {
  const oldW = W, oldH = H;
  setupCanvas();
  
  // Если размеры изменились, адаптируем позиции пузырей
  if (bubbles.length > 0 && (oldW !== W || oldH !== H)) {
    const scaleX = W / oldW;
    const scaleY = H / oldH;
    
    bubbles.forEach(bubble => {
      // Масштабируем позиции пузырей
      bubble.x = Math.max(bubble.radius, Math.min(W - bubble.radius, bubble.x * scaleX));
      bubble.y = Math.max(bubble.radius, Math.min(H - bubble.radius, bubble.y * scaleY));
      
      // Пересчитываем размеры пузырей
      const newBaseRadius = getBaseRadiusBasedOnScreenSize();
      bubble.radius = newBaseRadius + Math.log2(bubble.value) * (newBaseRadius / 3);
      
      // Обновляем физические параметры
      bubble.weight = getBubbleWeight(bubble.value);
      bubble.mass = getBubbleMass(bubble.value);
    });
     }
   
   // Принудительно удерживаем все пузыри в границах экрана
   constrainBubblesToScreen();
   
   // Обновляем счет с текущими данными
   setScore(score);
}

window.addEventListener('resize', handleResize);
window.addEventListener('orientationchange', () => {
  // Задержка для iOS Safari
  setTimeout(handleResize, 100);
});

// Обработчик для визуального viewport (мобильные браузеры)
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', handleResize);
}

// Добавляем обработчик клавиши R для перезапуска
window.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') {
    restartGame();
  }
});

setScore(0);
spawnInitialBubbles();
loop();
</script>
