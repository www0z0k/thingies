<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fusion Bubble Merge</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      overflow: hidden;
      background: #111;
      color: #fff;
      font-family: sans-serif;
      user-select: none;
    }
    canvas {
      display: block;
    }
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      font-size: 18px;
    }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="hud">Fusion Bubble Merge</div>

<script>
let score = 0;
const setScore = (val) => document.getElementById('hud').innerHTML = `Fusion Bubble Merge | Score: ${val}`;
setScore(0);
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W = window.innerWidth, H = window.innerHeight;
canvas.width = W;
canvas.height = H;

const colors = {
  2: '#eee', 4: '#add8e6', 8: '#87cefa', 16: '#4682b4', 32: '#f08080',
  64: '#f06', 128: '#fa0', 256: '#ff0', 512: '#0f0', 1024: '#0ff', 2048: '#fff',
  4096: '#c0c0c0', 8192: '#f00', 16384: '#800080', 32768: '#808080', 65536: '#f0f'
};

let bubbles = [];
let dragging = null;
let offsetX = 0;
let offsetY = 0;

const getBaseRadiusBasedOnScreenSize = () => {
  const baseRadius = Math.min(W, H) / 20; // Adjust this value to change bubble size
  return baseRadius;
};

function spawnBubble(x, y, value = 2) {
  const br = getBaseRadiusBasedOnScreenSize();
  let radius = br + Math.log2(value) * (br / 3);
  bubbles.push({ x, y, vx: 0, vy: 0, radius, value, merged: false });
}

function spawnInitialBubbles() {
  bubbles = [];
  // const values = [2, 2, 2, 4, 4, 8];
  // spawn ramdom bubbles with values 2, 4, 8
  const values = [];
  const numBubbles = Math.floor(Math.random() * 15) + 15;
  for (let i = 0; i < numBubbles; i++) {
    let val = Math.random() < 0.5 ? 2 : (Math.random() < 0.5 ? 4 : 8);
    values.push(val);
  } 
  for (let val of values) {
    let x = Math.random() * (W - 100) + 50;
    let y = Math.random() * (H - 100) + 50;
    spawnBubble(x, y, val);
  }
}

function drawBubble(b) {
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
  ctx.fillStyle = colors[b.value] || '#fff';
  ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.stroke();
  ctx.fillStyle = '#000';
  ctx.font = `${b.radius}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(b.value, b.x, b.y);
}

function distance(b1, b2) {
  let dx = b1.x - b2.x;
  let dy = b1.y - b2.y;
  return Math.sqrt(dx * dx + dy * dy);
}

function mergeBubbles(b1, b2) {
  b1.value *= 2;
  ++mergesPerMove;
  score += b1.value * Math.max(1, mergesPerMove / 2);
  setScore(score);
  const br = getBaseRadiusBasedOnScreenSize();
  b1.radius = br + Math.log2(b1.value) * (br / 3);
  b1.vx = (b1.vx + b2.vx) / 2;
  b1.vy = (b1.vy + b2.vy) / 2;
  b2.merged = true;

  for (let i = 0; i < 6; i++) {
    setTimeout(() => {
      ctx.beginPath();
      ctx.arc(b1.x, b1.y, b1.radius + i * 4, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,255,255,${1 - i / 6})`;
      ctx.stroke();
    }, i * 30);
  }
}

function hasAvailableMerges() {
  for (let i = 0; i < bubbles.length; i++) {
    for (let j = i + 1; j < bubbles.length; j++) {
      if (bubbles[i].value === bubbles[j].value) return true;
    }
  }
  return false;
}

function update() {
  for (let b of bubbles) {
    if (b !== dragging) {
      b.x += b.vx;
      b.y += b.vy;
      b.vx *= 0.98;
      b.vy *= 0.98;

      if (b.x - b.radius < 0 || b.x + b.radius > W) {
        b.vx *= -0.9;
        b.x = Math.max(b.radius, Math.min(W - b.radius, b.x));
      }
      if (b.y - b.radius < 0 || b.y + b.radius > H) {
        b.vy *= -0.9;
        b.y = Math.max(b.radius, Math.min(H - b.radius, b.y));
      }
    }
  }

  for (let i = 0; i < bubbles.length; i++) {
    for (let j = i + 1; j < bubbles.length; j++) {
      let b1 = bubbles[i], b2 = bubbles[j];
      if (b1.merged || b2.merged) continue;
      let d = distance(b1, b2);
      if (d < b1.radius + b2.radius) {
        if ((b1 === dragging || b2 === dragging) && b1.value === b2.value) {
          mergeBubbles(b1 === dragging ? b1 : b2, b1 === dragging ? b2 : b1);
        } else {
          let angle = Math.atan2(b2.y - b1.y, b2.x - b1.x);
          let overlap = b1.radius + b2.radius - d;
          let pushX = Math.cos(angle) * overlap / 2;
          let pushY = Math.sin(angle) * overlap / 2;
          b1.x -= pushX; b1.y -= pushY;
          b2.x += pushX; b2.y += pushY;
          b1.vx -= pushX * 0.05; b1.vy -= pushY * 0.05;
          b2.vx += pushX * 0.05; b2.vy += pushY * 0.05;
        }
      }
    }
  }

  bubbles = bubbles.filter(b => !b.merged);

  if (!hasAvailableMerges()) {
    for (let i = 0; i < 3; i++) {
      let x = Math.random() * (W - 100) + 50;
      let y = Math.random() * (H - 100) + 50;
      spawnBubble(x, y, Math.random() < 0.5 ? 2 : 4);
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  for (let b of bubbles) drawBubble(b);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function getPos(evt) {
  const rect = canvas.getBoundingClientRect();
  if (evt.touches) {
    return {
      x: evt.touches[0].clientX - rect.left,
      y: evt.touches[0].clientY - rect.top
    };
  } else {
    return {
      x: evt.clientX - rect.left,
      y: evt.clientY - rect.top
    };
  }
}

let mergesPerMove = 0;
function startDrag(e) {
  const { x, y } = getPos(e);
  for (let b of bubbles) {
    if (distance({ x, y }, b) < b.radius) {
      dragging = b;
      offsetX = x - b.x;
      offsetY = y - b.y;
      break;
    }
  }
}

function moveDrag(e) {
  if (dragging) {
    const { x, y } = getPos(e);
    dragging.x = x - offsetX;
    dragging.y = y - offsetY;
  }
}

function endDrag() {
  if (dragging) {
    dragging.vx = 0;
    dragging.vy = 0;
    mergesPerMove = 0;

    if (Math.random() < 0.8) {
      const quantity = Math.floor(Math.random() * 6) + 1;
      for (let i = 0; i < quantity; i++) {
        let x = Math.random() * (W - 100) + 50;
        let y = Math.random() * (H - 100) + 50;
        spawnBubble(x, y, Math.random() < 0.5 ? 2 : 4);
      }
    }
  }
  dragging = null;
}

canvas.addEventListener('mousedown', startDrag);
canvas.addEventListener('mousemove', moveDrag);
canvas.addEventListener('mouseup', endDrag);

canvas.addEventListener('touchstart', startDrag);
canvas.addEventListener('touchmove', e => { moveDrag(e); e.preventDefault(); }, { passive: false });
canvas.addEventListener('touchend', endDrag);

window.addEventListener('resize', () => {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
});

spawnInitialBubbles();
loop();
</script>
</body>
</html>
