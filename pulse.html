<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pulse Chain Puzzle — Responsive</title>
  <style>
    :root {
      /* JS updates these at runtime */
      --tile-size: 50px;          /* fallback */
      --tile-font: 18px;          /* fallback */
      --tile-value-font: 13px;    /* fallback */
      --tile-radius: 40%;
      --grid-gap: 5px;            /* keep in sync w/ #grid gap */
    }

    body {
      background: #111;
      color: #eee;
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h1 { margin-bottom: 10px; }

    #grid {
      display: grid;
      gap: var(--grid-gap);
      justify-content: center;
      margin: 20px auto;
      /* width & height set inline from JS */
    }

    .tile,
    .tile-bubble {
      width: var(--tile-size);
      height: var(--tile-size);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--tile-radius);
      font-size: var(--tile-font);
      cursor: pointer;
      user-select: none;
      position: relative;
      overflow: visible;
      margin: 0; /* grid-gap handles spacing */
      box-shadow: none;
      transition: box-shadow 0.2s, filter 0.2s, transform 0.2s;
      background: #333;
      will-change: transform, filter;
    }

    .tile-bubble.pulse,
    .tile.pulse {
      animation: popit-in 0.32s cubic-bezier(.35,1.8,.6,1.03);
    }

    @keyframes popit-in {
      0%   { transform: scale(1);   filter: brightness(1.1); }
      30%  { transform: scale(0.88); filter: brightness(1.2); }
      70%  { transform: scale(1.08); filter: brightness(1.08); }
      100% { transform: scale(1);   filter: brightness(1); }
    }

    .tile-bubble::before { display: none; }

    .value-text {
      position: absolute;
      right: calc(var(--tile-size) * 0.14);
      bottom: calc(var(--tile-size) * 0.04);
      font-size: var(--tile-value-font);
      color: #fff;
      text-shadow: 1px 1px 2px #111, 0 0 2px #000;
      pointer-events: none;
      user-select: none;
      z-index: 2;
    }

    button,
    select {
      margin-top: 10px;
      padding: 8px 16px;
      font-size: 16px;
    }

    #displayToggleLabel {
      font-size: 16px;
      margin-left: 12px;
      user-select: none;
    }

    /* Bubble CSS for values 1–9 */
    .tile-bubble {
      background: #333;
      box-shadow: 0 0 6px #99d5ff44;
    }
    .tile-bubble[data-val="1"] {
      background:
        radial-gradient(circle at 60% 30%, rgba(255,255,255,0.19) 10%, transparent 55%),
        radial-gradient(circle at 50% 50%, #aee8ff44 70%, #333 100%);
    }
    .tile-bubble[data-val="2"] {
      background:
        radial-gradient(circle at 60% 30%, rgba(255,255,255,0.23) 10%, transparent 56%),
        radial-gradient(circle at 50% 56%, #84c8fa66 66%, #338cf188 86%, #333 100%);
    }
    .tile-bubble[data-val="3"] {
      background:
        radial-gradient(circle at 60% 30%, rgba(255,255,255,0.28) 12%, transparent 58%),
        radial-gradient(circle at 45% 60%, #6ec2fa99 62%, #217bceb0 87%, #333 100%);
    }
    .tile-bubble[data-val="4"] {
      background:
        radial-gradient(circle at 60% 30%, rgba(255,255,255,0.32) 14%, transparent 61%),
        radial-gradient(circle at 52% 48%, #58b2faee 60%, #1366bdcc 90%, #333 100%);
    }
    .tile-bubble[data-val="5"] {
      background:
        radial-gradient(circle at 60% 30%, rgba(255,255,255,0.36) 15%, transparent 63%),
        radial-gradient(circle at 52% 52%, #2990e5ee 58%, #0356aacc 88%, #333 100%);
    }
    .tile-bubble[data-val="6"] {
      background:
        radial-gradient(circle at 60% 30%, rgba(255,255,255,0.40) 16%, transparent 66%),
        radial-gradient(circle at 50% 54%, #1572d8ff 56%, #0a326b 90%, #333 100%);
    }
    .tile-bubble[data-val="7"] {
      background:
        radial-gradient(circle at 60% 30%, rgba(255,255,255,0.44) 16%, transparent 70%),
        radial-gradient(circle at 52% 49%, #2f8be5ff 53%, #17305bff 90%, #333 100%);
    }
    .tile-bubble[data-val="8"] {
      background:
        radial-gradient(circle at 60% 30%, rgba(255,255,255,0.49) 18%, transparent 75%),
        radial-gradient(circle at 54% 54%, #2278d6ff 51%, #112c5dff 92%, #333 100%);
    }
    .tile-bubble[data-val="9"] {
      background:
        radial-gradient(circle at 60% 30%, rgba(255,255,255,0.54) 19%, transparent 80%),
        radial-gradient(circle at 50% 50%, #0d4ebdff 48%, #061739ff 95%, #333 100%);
    }
  </style>
</head>
<body>
  <h1>Pulse Chain Puzzle</h1>
  <div id="info"></div>
  <select id="mode" onchange="changeMode()">
    <option value="challenge">Challenge Mode</option>
    <option value="zen">Zen Mode</option>
  </select>
  <label id="displayToggleLabel">
    <input type="checkbox" id="displayToggle" checked onchange="render()" />
    Bubble CSS View
  </label>
  <div id="grid"></div>
  <button onclick="resetGame()">Restart Level</button>

  <script>
    /* --------------------------------------------------
     * Globals
     * -------------------------------------------------- */
    let grid, container, rows, cols, level = 1, totalScore = 0, levelScore = 0, mode = 'challenge';
    let initialGrid, initialScore;
    let displayMode = 'classic'; // or 'bubble'
    let pulseQueue = [];
    let history = [];

    /* Cached gap (keep in sync w/ CSS --grid-gap) */
    const GRID_GAP = 5; // px

    /* --------------------------------------------------
     * Responsive sizing
     * Grid should be ~80% of the lesser viewport dimension.
     * We fit BOTH width & height: choose the largest tile size that fits.
     * -------------------------------------------------- */
    function resizeGrid() {
      if (!container) return;
      const lesser = Math.min(window.innerWidth, window.innerHeight);
      const target = lesser * 0.7; // desired max px for the whole grid (square box)

      // available size minus total gaps
      const availW = target - GRID_GAP * (cols - 1);
      const availH = target - GRID_GAP * (rows - 1);

      // tile size limited by both width & height
      const tileSize = Math.floor(Math.min(availW / cols, availH / rows));

      // derive font sizes relative to tile
      const tileFont = Math.max(12, Math.floor(tileSize * 0.36));
      const tileValueFont = Math.max(10, Math.floor(tileSize * 0.26));

      // set CSS vars
      document.documentElement.style.setProperty('--tile-size', tileSize + 'px');
      document.documentElement.style.setProperty('--tile-font', tileFont + 'px');
      document.documentElement.style.setProperty('--tile-value-font', tileValueFont + 'px');

      // container pixel size
      const gridW = tileSize * cols + GRID_GAP * (cols - 1);
      const gridH = tileSize * rows + GRID_GAP * (rows - 1);
      container.style.width = gridW + 'px';
      container.style.height = gridH + 'px';

      // update gridTemplateColumns to match tile count (auto size)
      container.style.gridTemplateColumns = `repeat(${cols}, ${tileSize}px)`;
    }

    /* --------------------------------------------------
     * Level setup & state mgmt
     * -------------------------------------------------- */
    function setupLevel() {
      rows = cols = (mode === 'challenge' ? Math.min(4 + Math.floor(level / 3), 8) : 6);
      grid = Array.from({ length: rows }, () => Array(cols).fill(0));
      container = document.getElementById('grid');

      if (mode === 'challenge') {
        for (let i = 0; i < level + 3; i++) reverseClick();
      } else {
        randomFill(10);
      }

      levelScore = 0;
      saveInitial();
      resizeGrid();
      render();
      updateInfo();
    }

    function saveInitial() {
      initialGrid = grid.map(row => row.slice());
      initialScore = levelScore;
    }

    function restoreInitial() {
      grid = initialGrid.map(row => row.slice());
      levelScore = initialScore;
      resizeGrid();
      render();
      updateInfo();
    }

    /* --------------------------------------------------
     * Rendering
     * -------------------------------------------------- */
    function render() {
      displayMode = document.getElementById('displayToggle').checked ? 'bubble' : 'classic';
      container.innerHTML = '';
      grid.forEach((r, y) => r.forEach((val, x) => {
        const isBubble = (displayMode === 'bubble');
        const tile = document.createElement('div');
        tile.className = isBubble ? 'tile-bubble' : 'tile';
        tile.dataset.x = x;
        tile.dataset.y = y;
        tile.dataset.val = val;
        tile.onclick = () => clickTile(x, y);

        if (shouldPulse(x, y)) {
          tile.classList.add('pulse');
          setTimeout(() => tile.classList.remove('pulse'), 330);
        }

        if (isBubble) {
          if (val > 0) {
            const valText = document.createElement('div');
            valText.className = 'value-text';
            valText.textContent = val;
            tile.appendChild(valText);
          }
        } else {
          tile.textContent = val || '';
        }

        container.appendChild(tile);
      }));
      pulseQueue = [];
    }

    /* --------------------------------------------------
     * Gameplay helpers
     * -------------------------------------------------- */
    function reverseClick() {
      const x = Math.floor(Math.random() * cols), y = Math.floor(Math.random() * rows);
      grid[y][x]++;
      [[0,-1],[0,1],[-1,0],[1,0]].forEach(([dx,dy]) => {
        const nx = x + dx, ny = y + dy;
        if (inBounds(nx,ny)) grid[ny][nx]++;
      });
    }

    function randomFill(count) {
      for (let i = 0; i < count; i++) {
        const x = Math.floor(Math.random() * cols), y = Math.floor(Math.random() * rows);
        grid[y][x] = Math.min(grid[y][x] + 1, 9);
      }
    }

    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

    async function clickTile(x, y) {
      if (getVal(x,y) < 1) return;
      saveState();
      const pulses = [];
      [[0,-1],[0,1],[-1,0],[1,0]].forEach(([dx,dy]) => {
        const nx = x + dx, ny = y + dy;
        if (inBounds(nx,ny) && grid[ny][nx] > 0) {
          grid[ny][nx] = Math.max(0, grid[ny][nx] - 1);
          pulses.push([nx, ny]);
        }
      });
      let centerPulse = false;
      if (pulses.length || grid[y][x] === 1) {
        grid[y][x] = Math.max(0, grid[y][x] - 1);
        centerPulse = true;
        levelScore++;
        if (mode === 'zen') {
          randomFill(Math.ceil(Math.random() * 5));
        }
        pulseQueue = [...pulses, [x, y]];
        render();
        await sleep(330);
        checkWin();
      }
      updateInfo();
    }

    function getVal(x,y){ return inBounds(x,y) ? grid[y][x] : 0; }
    function inBounds(x,y){ return x>=0 && y>=0 && x<cols && y<rows; }

    function shouldPulse(x,y){ return pulseQueue.some(([px,py]) => px===x && py===y); }

    function checkWin() {
      if (mode === 'challenge' && grid.flat().every(v => v === 0)) {
        totalScore += Math.max(0, (rows * cols) - levelScore);
        setTimeout(() => {
          alert(`Level ${level} cleared!\nLevel Score: ${Math.max(0, (rows*cols) - levelScore)}\nTotal Score: ${totalScore}`);
          level++;
          setupLevel();
        }, 300);
      }
    }

    function resetGame(){ restoreInitial(); }

    function updateInfo(){
      document.getElementById('info').innerText =
        `Mode: ${mode.charAt(0).toUpperCase() + mode.slice(1)} | Level: ${level} | Score: ${Math.max(0,(rows*cols)-levelScore)} | Total Score: ${totalScore}`;
    }

    function changeMode(){
      mode = document.getElementById('mode').value;
      level = 1; totalScore = 0;
      setupLevel();
    }

    /* --------------------------------------------------
     * Undo support
     * -------------------------------------------------- */
    function saveState(){
      history.push({
        grid: grid.map(r => r.slice()),
        levelScore: levelScore
      });
      if (history.length > 200) history.shift();
    }
    function undoMove(){
      if (!history.length) return;
      const prev = history.pop();
      grid = prev.grid.map(r => r.slice());
      levelScore = prev.levelScore;
      render();
      updateInfo();
    }

    (function addUndoBtn(){
      const btn = document.createElement('button');
      btn.innerText = 'Undo';
      btn.onclick = undoMove;
      btn.style.marginLeft = '10px';
      document.body.insertBefore(btn, document.getElementById('grid'));
    })();

    /* --------------------------------------------------
     * Event listeners
     * -------------------------------------------------- */
    window.addEventListener('resize', () => {
      resizeGrid();
    });

    // Initial boot
    setupLevel();
  </script>
</body>
</html>
