<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pulse Chain Puzzle — Bubble Style</title>
  <style>
    body { background: #111; color: #eee; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
    h1 { margin-bottom: 10px; }
    #grid { display: grid; gap: 5px; justify-content: center; margin: 20px auto; }
    .tile, .tile-bubble {
  width: 50px; height: 50px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  user-select: none;
  position: relative;
  overflow: visible;
  margin: 3px;
  box-shadow: none;
  transition: box-shadow 0.2s;
  background: #333; /* fallback, overridden by [data-val] */
}
.tile-bubble::before {
  content: '';
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: 50px; height: 50px;
  border-radius: 50%;
  opacity: 0;
  pointer-events: none;
  z-index: 0;
  background: radial-gradient(circle, #8cf7ff 0%, #8cf7ff22 70%, transparent 100%);
}
.tile-bubble.pulse::before {
  animation: pulse-glow 0.35s cubic-bezier(.4,1.3,.7,1.2);
  opacity: 1;
}
@keyframes pulse-glow {
  0%   { opacity: 0.8; transform: translate(-50%,-50%) scale(1); }
  60%  { opacity: 1; transform: translate(-50%,-50%) scale(1.25);}
  100% { opacity: 0; transform: translate(-50%,-50%) scale(1.5);}
}
.value-text {
  position: absolute; right: 7px; bottom: 2px; font-size: 13px; color: #fff;
  text-shadow: 1px 1px 2px #111, 0 0 2px #000;
  pointer-events: none; user-select: none; z-index: 2;
}
    button, select { margin-top: 10px; padding: 8px 16px; font-size: 16px; }
    #displayToggleLabel { font-size: 16px; margin-left: 12px; }
    /* Bubble CSS for values 1–9 */
    .tile-bubble {
      background: #333;
      box-shadow: 0 0 6px #99d5ff44;
    }
    .tile-bubble[data-val="1"] {
      background:
        radial-gradient(circle at 60% 30%, rgba(255,255,255,0.19) 10%, transparent 55%),
        radial-gradient(circle at 50% 50%, #aee8ff44 70%, #333 100%);
    }
    .tile-bubble[data-val="2"] {
      background:
        radial-gradient(circle at 60% 30%, rgba(255,255,255,0.23) 10%, transparent 56%),
        radial-gradient(circle at 50% 56%, #84c8fa66 66%, #338cf188 86%, #333 100%);
    }
    .tile-bubble[data-val="3"] {
      background:
        radial-gradient(circle at 60% 30%, rgba(255,255,255,0.28) 12%, transparent 58%),
        radial-gradient(circle at 45% 60%, #6ec2fa99 62%, #217bceb0 87%, #333 100%);
    }
    .tile-bubble[data-val="4"] {
      background:
        radial-gradient(circle at 60% 30%, rgba(255,255,255,0.32) 14%, transparent 61%),
        radial-gradient(circle at 52% 48%, #58b2faee 60%, #1366bdcc 90%, #333 100%);
    }
    .tile-bubble[data-val="5"] {
      background:
        radial-gradient(circle at 60% 30%, rgba(255,255,255,0.36) 15%, transparent 63%),
        radial-gradient(circle at 52% 52%, #2990e5ee 58%, #0356aacc 88%, #333 100%);
    }
    .tile-bubble[data-val="6"] {
      background:
        radial-gradient(circle at 60% 30%, rgba(255,255,255,0.40) 16%, transparent 66%),
        radial-gradient(circle at 50% 54%, #1572d8ff 56%, #0a326b 90%, #333 100%);
    }
    .tile-bubble[data-val="7"] {
      background:
        radial-gradient(circle at 60% 30%, rgba(255,255,255,0.44) 16%, transparent 70%),
        radial-gradient(circle at 52% 49%, #2f8be5ff 53%, #17305bff 90%, #333 100%);
    }
    .tile-bubble[data-val="8"] {
      background:
        radial-gradient(circle at 60% 30%, rgba(255,255,255,0.49) 18%, transparent 75%),
        radial-gradient(circle at 54% 54%, #2278d6ff 51%, #112c5dff 92%, #333 100%);
    }
    .tile-bubble[data-val="9"] {
      background:
        radial-gradient(circle at 60% 30%, rgba(255,255,255,0.54) 19%, transparent 80%),
        radial-gradient(circle at 50% 50%, #0d4ebdff 48%, #061739ff 95%, #333 100%);
    }
  </style>
</head>
<body>
  <h1>Pulse Chain Puzzle</h1>
  <div id="info"></div>
  <select id="mode" onchange="changeMode()">
    <option value="challenge">Challenge Mode</option>
    <option value="zen">Zen Mode</option>
  </select>
  <label id="displayToggleLabel">
    <input type="checkbox" id="displayToggle" onchange="render()" />
    Bubble CSS View
  </label>
  <div id="grid"></div>
  <button onclick="resetGame()">Restart Level</button>

  <script>
    let grid, container, rows, cols, level=1, totalScore=0, levelScore=0, mode='challenge';
    let initialGrid, initialScore;
    let displayMode = 'classic'; // or 'bubble'
    let pulseQueue = [];

    function setupLevel() {
      rows = cols = mode=='challenge'?Math.min(4+Math.floor(level/3),8):6;
      grid = Array.from({length:rows},()=>Array(cols).fill(0));
      container = document.getElementById('grid');
      container.style.gridTemplateColumns = `repeat(${cols},50px)`;

      if(mode=='challenge')for(let i=0;i<level+3;i++)reverseClick();
      if(mode=='zen')randomFill(10);

      levelScore = 0;
      saveInitial();
      render();
      updateInfo();
    }

    function saveInitial() {
      initialGrid = grid.map(row => row.slice());
      initialScore = levelScore;
    }

    function restoreInitial() {
      grid = initialGrid.map(row => row.slice());
      levelScore = initialScore;
      render();
      updateInfo();
    }

    function render() {
      displayMode = document.getElementById('displayToggle').checked ? 'bubble' : 'classic';
      container.innerHTML = '';
      grid.forEach((r, y) => r.forEach((val, x) => {
        if (displayMode === 'bubble') {
          let tile = document.createElement('div');
          tile.className = 'tile-bubble';
          tile.dataset.x = x;
          tile.dataset.y = y;
          tile.dataset.val = val;
          tile.onclick = () => clickTile(x, y);

          if (shouldPulse(x, y)) {
            tile.classList.add('pulse');
            setTimeout(() => tile.classList.remove('pulse'), 330);
          }
          if (val > 0) {
            let valText = document.createElement('div');
            valText.className = 'value-text';
            valText.textContent = val;
            tile.appendChild(valText);
          }
          container.appendChild(tile);
        } else {
          let div = document.createElement('div');
          div.className = 'tile';
          div.dataset.x = x; div.dataset.y = y; div.dataset.val = val;
          div.innerText = val || '';
          div.onclick = () => clickTile(x, y);

          if (shouldPulse(x, y)) {
            div.classList.add('pulse');
            setTimeout(() => div.classList.remove('pulse'), 330);
          }

          container.appendChild(div);
        }
      }));
      pulseQueue = [];
    }

    function reverseClick() {
      let x = Math.floor(Math.random() * cols), y = Math.floor(Math.random() * rows);
      grid[y][x]++;
      [[0,-1],[0,1],[-1,0],[1,0]].forEach(([dx,dy]) => {
        let nx = x+dx, ny = y+dy;
        if(nx>=0 && ny>=0 && nx<cols && ny<rows) grid[ny][nx]++;
      });
    }

    function randomFill(count) {
      for(let i=0; i<count; i++) {
        let x=Math.floor(Math.random()*cols), y=Math.floor(Math.random()*rows);
        grid[y][x]=Math.min(grid[y][x]+1,9);
      }
    }

    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

    async function clickTile(x, y) {
      let tile = getTile(x, y);
      if (!tile || getVal(x,y)<1) return;
      saveState();
      let pulses = [];
      [[0,-1],[0,1],[-1,0],[1,0]].forEach(([dx,dy]) => {
        let nx=x+dx, ny=y+dy;
        if (inBounds(nx,ny) && grid[ny][nx]>0) {
          grid[ny][nx]=Math.max(0,grid[ny][nx]-1);
          pulses.push([nx, ny]);
        }
      });
      let centerPulse = false;
      if (pulses.length || grid[y][x] === 1) {
        grid[y][x]=Math.max(0,grid[y][x]-1);
        centerPulse = true;
        levelScore++;
        if (mode==='zen') {
          randomFill(Math.ceil(Math.random()*5));
        }
        pulseQueue = [...pulses, [x, y]];
        render();
        await sleep(330);
        checkWin();
      }
      updateInfo();
    }

    function getVal(x,y) {
      if (!inBounds(x,y)) return 0;
      return grid[y][x];
    }

    function inBounds(x,y) {
      return x>=0&&y>=0&&x<cols&&y<rows;
    }

    function getTile(x,y) {
      return container.querySelector(`.tile, .tile-bubble[data-x='${x}'][data-y='${y}']`);
    }

    function shouldPulse(x, y) {
      return pulseQueue.some(([px,py]) => px===x && py===y);
    }

    function checkWin() {
      if (mode==='challenge' && grid.flat().every(v => v===0)) {
        totalScore += Math.max(0, (rows*cols)-levelScore);
        setTimeout(() => {
          alert(`Level ${level} cleared!\nLevel Score: ${Math.max(0,(rows*cols)-levelScore)}\nTotal Score: ${totalScore}`);
          level++;
          setupLevel();
        }, 300);
      }
    }

    function resetGame() { restoreInitial(); }

    function updateInfo() {
      document.getElementById('info').innerText =
        `Mode: ${mode.charAt(0).toUpperCase()+mode.slice(1)} | Level: ${level} | Score: ${Math.max(0,(rows*cols)-levelScore)} | Total Score: ${totalScore}`;
    }

    function changeMode() {
      mode = document.getElementById('mode').value;
      level = 1; totalScore = 0;
      setupLevel();
    }

    // Undo implementation (stores a history of moves)
    let history = [];
    function saveState() {
      history.push({
        grid: grid.map(row => row.slice()),
        levelScore: levelScore
      });
      if (history.length > 200) history.shift();
    }
    function undoMove() {
      if (!history.length) return;
      let prev = history.pop();
      grid = prev.grid.map(row => row.slice());
      levelScore = prev.levelScore;
      render();
      updateInfo();
    }

    (function addUndoBtn() {
      let btn = document.createElement('button');
      btn.innerText = 'Undo';
      btn.onclick = undoMove;
      btn.style.marginLeft = '10px';
      document.body.insertBefore(btn, document.getElementById('grid'));
    })();

    setupLevel();
  </script>
</body>
</html>
