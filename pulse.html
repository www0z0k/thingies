<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pulse Chain Puzzle — Responsive</title>
  <style>
    :root {
      --tile-size: 50px;          /* fallback, will be updated from JS for adaptivity */
      --tile-font: 18px;          /* fallback */
      --tile-value-font: 13px;    /* fallback */
      --tile-radius: 40%;
      --grid-gap: 5px;
      --fancy: linear-gradient(90deg, #48e0d1 0%, #4686ff 100%);
      --fancy2: linear-gradient(90deg, #a0ffd3 0%, #38b0ff 100%);
      --btn-radius: 999px;
    }
    body {
      background: #111;
      color: #eee;
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 { margin-bottom: 10px; }
    .controls-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .fancy-btn, .fancy-select {
      border: none;
      outline: none;
      font-size: 17px;
      padding: 8px 22px;
      margin: 0;
      background: var(--fancy);
      color: #fff;
      border-radius: var(--btn-radius);
      box-shadow: 0 2px 14px #1a89ef28;
      transition: background 0.19s, transform 0.12s, box-shadow 0.19s;
      cursor: pointer;
      font-weight: 600;
      position: relative;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .fancy-btn:active, .fancy-select:active {
      background: var(--fancy2);
      transform: scale(0.96);
    }
    .fancy-btn[disabled], .fancy-select[disabled] {
      opacity: 0.55;
      filter: grayscale(0.7);
      cursor: not-allowed;
    }
    .counter {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 17px;
      font-weight: 700;
      margin: 0 2px;
      background: #263245d5;
      border-radius: 12px;
      padding: 4px 12px;
      box-shadow: 0 1px 4px #0002;
      line-height: 1.25;
      user-select: none;
      letter-spacing: 0.01em;
    }
    .counter.lives { color: #ff7575; }
    .counter.keys  { color: #f5e542; }
    .counter .icon { font-size: 1.16em; }
    .badge {
      position: fixed;
      left: 50%; top: 15%;
      transform: translate(-50%, 0) scale(.92);
      background: #202c31e6;
      color: #fff;
      padding: .55em 1.6em;
      border-radius: 999px;
      font-size: clamp(15px, 2.4vw, 25px);
      line-height: 1.25;
      opacity: 0;
      pointer-events: none;
      transition: opacity .23s, transform .22s;
      z-index: 9999;
      white-space: nowrap;
      box-shadow: 0 6px 24px #0007;
      border: 2px solid #51e7ff44;
    }
    .badge.visible {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
    }
    #grid {
      display: grid;
      gap: var(--grid-gap);
      justify-content: center;
      margin: 20px auto;
    }
    .bubble {
      width: var(--tile-size);
      height: var(--tile-size);
      border-radius: 40%;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      font-size: 1.07em;
      font-weight: bold;
      color: #fff;
      text-shadow: 1px 1px 3px #111, 0 0 1.5px #000;
      box-sizing: border-box;
      user-select: none;
      transition: box-shadow 0.19s, background 0.17s;
    }
    .bubble .val {
      position: absolute;
      bottom: 5px; right: 7px;
      font-size: 0.89em;
      opacity: 0.82;
      pointer-events: none;
      user-select: none;
      z-index: 2;
      font-weight: 400;
    }
    .bubble.empty {
      background: radial-gradient(circle at 60% 35%, #fff2 22%, #d3d3e209 85%, #222 120%);
      box-shadow: 0 2px 10px #fff1 inset;
      cursor: default !important;
      pointer-events: none;
      color: transparent !important;
      transition: background 0.14s, box-shadow 0.14s;
      border: none;
    }
    .bubble.empty:hover { filter: none; }
    .icon-btn {
      font-size: 1.13em;
      margin-right: 0;
      margin-left: 0;
      pointer-events: none;
      user-select: none;
      display: flex; align-items: center; line-height: 1;
    }
  </style>
</head>
<body>
  <h1>Pulse Chain Puzzle</h1>
  <div id="info"></div>
<div class="controls-row">
  <select id="mode" class="fancy-select" onchange="changeMode()">
    <option value="challenge">Challenge Mode</option>
    <option value="zen">Zen Mode</option>
  </select>
  <button id="restartBtn" class="fancy-btn" onclick="restartWithLife()">
    <span class="icon-btn" aria-label="Restart" style="margin-right:2px;">
      <!-- Recycle SVG -->
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
     xmlns="http://www.w3.org/2000/svg">
        <path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 8 8h-2
           a6 6 0 1 1-6-6c1.61 0 3.09.63 4.24 1.76L13 11h7V4l-2.35 2.35z"
        fill="currentColor"/>
      </svg>
    </span>
    <span class="counter lives" id="livesCounter"><span class="icon">❤️</span><span id="livesVal">5</span></span>
  </button>
  <button id="undoBtn" class="fancy-btn" onclick="undoWithKey()">
    <span class="icon-btn" aria-label="Undo" style="margin-right:2px;">
      <!-- Undo SVG -->
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" style="vertical-align:middle;" xmlns="http://www.w3.org/2000/svg">
        <path d="M4.5 10L10 4.5M4.5 10L10 15.5M4.5 10H17" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    
    <span class="counter keys" id="keysCounter"><span class="icon">🔑</span><span id="keysVal">5</span></span>
  </button>
</div>

  <div id="grid"></div>
  <script>
    // ----- Color interpolation (spectral)
    function lerp(a, b, t) { return a + (b - a) * t; }
    function lerpColorRGB(stops, val) {
      for (let i = 0; i < stops.length - 1; ++i) {
        const [v0, c0] = stops[i], [v1, c1] = stops[i+1];
        if (val >= v0 && val <= v1) {
          const t = (val - v0) / (v1 - v0);
          return [
            Math.round(lerp(c0[0], c1[0], t)),
            Math.round(lerp(c0[1], c1[1], t)),
            Math.round(lerp(c0[2], c1[2], t))
          ];
        }
      }
      return stops[stops.length-1][1];
    }
    function getBubbleStyle(val) {
      const colorStops = [
        [1,   [44,180,44]],
        [20,  [255,255,0]],
        [40,  [255,180,0]],
        [60,  [0,255,255]],
        [80,  [0,0,255]],
        [100, [192,0,255]]
      ];
      const capped = Math.min(val, 100);
      const [r,g,b] = lerpColorRGB(colorStops, capped);
      const light = 76 - capped * 0.44;
      const gradEnd = 66 - capped * 0.5;
      const highlightAlpha = 0.32 - capped * 0.0012;
      return `
        background:
          radial-gradient(circle at 62% 28%, rgba(255,255,255,${highlightAlpha.toFixed(2)}) 14%, transparent ${gradEnd}%),
          radial-gradient(circle at 51% 52%, rgb(${r},${g},${b}) 68%, #181a1f 100%);
        box-shadow: 0 0 1.4px 0 rgba(${r},${g},${b},0.12);
      `;
    }

    // ---- Game variables
    let lives = 5, keys = 5;
    let grid, container, rows, cols, level = 1, totalScore = 0, levelScore = 0, mode = 'challenge';
    let initialGrid, initialScore;
    let pulseQueue = [], history = [];

    // ---- Responsive grid
    function updateGridColumns() {
      if (!container) return;
      const tileSize = getComputedStyle(document.documentElement).getPropertyValue('--tile-size').trim() || '50px';
      container.style.gridTemplateColumns = `repeat(${cols}, ${tileSize})`;
    }

    function setupLevel() {
      rows = cols = (mode === 'challenge' ? Math.min(4 + Math.floor(level / 3), 8) : 6);
      grid = Array.from({ length: rows }, () => Array(cols).fill(0));
      container = document.getElementById('grid');
      for (let i = 0; i < (mode === 'challenge' ? level + 3 : 10); i++)
        reverseClick();
      levelScore = 0;
      saveInitial();
      updateGridSize();
      render();
      updateInfo();
      updateCounters();
    }

    // Responsive grid sizing for any screen
    function updateGridSize() {
      if (!container) return;
      const lesser = Math.min(window.innerWidth, window.innerHeight);
      const target = lesser * 0.7;
      const availW = target - 5 * (cols - 1);
      const availH = target - 5 * (rows - 1);
      const tileSize = Math.floor(Math.min(availW / cols, availH / rows));
      document.documentElement.style.setProperty('--tile-size', tileSize + 'px');
      document.documentElement.style.setProperty('--tile-font', Math.max(12, Math.floor(tileSize * 0.36)) + 'px');
      document.documentElement.style.setProperty('--tile-value-font', Math.max(10, Math.floor(tileSize * 0.26)) + 'px');
      updateGridColumns();
    }

    window.addEventListener('resize', updateGridSize);

    function saveInitial() {
      initialGrid = grid.map(row => row.slice());
      initialScore = levelScore;
    }
    function restoreInitial() {
      grid = initialGrid.map(row => row.slice());
      levelScore = initialScore;
      updateGridSize();
      render();
      updateInfo();
      updateCounters();
    }
    function render() {
      container.innerHTML = '';
      updateGridColumns();
      for (let y=0; y<grid.length; ++y) for (let x=0; x<grid[0].length; ++x) {
        const val = grid[y][x];
        const bubble = document.createElement('div');
        bubble.className = 'bubble' + (val === 0 ? ' empty' : '');
        bubble.style = (val>0) ? getBubbleStyle(val) : '';
        bubble.onclick = val > 0 ? (() => clickTile(x, y)) : null;
        if (val > 0) bubble.innerHTML = `<span class="val">${val}</span>`;
        container.appendChild(bubble);
      }
      pulseQueue = [];
      updateCounters();
    }
    function reverseClick() {
      const x = Math.floor(Math.random() * cols), y = Math.floor(Math.random() * rows);
      grid[y][x]++;
      [[0,-1],[0,1],[-1,0],[1,0]].forEach(([dx,dy]) => {
        const nx = x + dx, ny = y + dy;
        if (nx>=0 && ny>=0 && nx<cols && ny<rows) grid[ny][nx]++;
      });
    }
    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
    async function clickTile(x, y) {
      if (grid[y][x] < 1) return;
      saveState();
      let affected = 0, destroyed = 0;
      const pulses = [];
      [[0,-1],[0,1],[-1,0],[1,0]].forEach(([dx,dy]) => {
        const nx = x + dx, ny = y + dy;
        if (nx>=0 && ny>=0 && nx<cols && ny<rows && grid[ny][nx]>0) {
          affected++;
          grid[ny][nx] = Math.max(0, grid[ny][nx] - 1);
          if (grid[ny][nx] === 0) destroyed++;
          pulses.push([nx, ny]);
        }
      });
      let centerPulse = false;
      if (pulses.length || grid[y][x] === 1) {
        grid[y][x] = Math.max(0, grid[y][x] - 1);
        centerPulse = true;
        if (grid[y][x] === 0) { destroyed++; affected++; }
        const moveScore = 1 + affected * (affected - 1) + destroyed * (destroyed + 1);
        levelScore += moveScore;
        pulseQueue = [...pulses, [x, y]];
        render();
        if (moveScore > 25)      await createBadge(`Awesome move! +${moveScore} pts`, 500, {background:'#0a0',color:'#fff'});
        else if (moveScore > 16) await createBadge(`Great move! +${moveScore} pts`, 500, {background:'#0a0',color:'#fff'});
        else if (moveScore > 10) await createBadge(`Nice move! +${moveScore} pts`, 500, {background:'#0a0',color:'#fff'});
        else await sleep(330);
        checkWin();
      }
      updateInfo();
      updateCounters();
    }
    function checkWin() {
      if (mode === 'challenge' && grid.flat().every(v => v === 0)) {
        totalScore += levelScore;
        createBadge(`Level ${level} cleared! +${levelScore} pts`, 800, {background:'#0a0',color:'#fff'});
        setTimeout(() => { level++; setupLevel(); }, 300);
      } else if (mode === 'zen') {
        const allEmpty = grid.flat().every(v => v === 0);
        if (allEmpty) {
          createBadge(`Zen achieved! Total score: ${totalScore}`, 800, {background:'#0a0',color:'#fff'});
          setTimeout(() => { level = 1; totalScore = 0; setupLevel(); }, 300);
        } else {
          const rnd = Math.floor(Math.random() * 5);
          for (let i = 0; i < rnd; i++) {
            reverseClick();
          }
        }
      }
    }
    function resetGame() { restoreInitial(); }
    function updateInfo() {
      document.getElementById('info').innerText =
        `Mode: ${mode.charAt(0).toUpperCase() + mode.slice(1)} | Level: ${level} | Score: ${levelScore} | Total Score: ${totalScore}`;
    }
    function changeMode() {
      mode = document.getElementById('mode').value;
      level = 1; totalScore = 0;
      lives = 5; keys = 5;
      setupLevel();
    }
    function updateCounters() {
      document.getElementById('livesVal').textContent = lives;
      document.getElementById('keysVal').textContent  = keys;
      document.getElementById('restartBtn').disabled = (lives < 1);
      document.getElementById('undoBtn').disabled    = (keys  < 1 || !history.length);
    }
    function saveState() {
      history.push({
        grid: grid.map(r => r.slice()),
        levelScore: levelScore,
        level: level,
      });
      if (history.length > 200) history.shift();
      updateCounters();
    }
    function undoWithKey() {
      if (keys < 1) {
        createBadge('No keys left!', 1000, {background:'#fc0',color:'#222'});
        return;
      }
      if (!history.length || history[history.length - 1].level !== level) {
        createBadge('Nothing to undo!', 1000, {background:'#fc0',color:'#222'});
        return;
      }
      keys--;
      undoMove();
      updateCounters();
    }
    function restartWithLife() {
      if (lives < 1 || !history.length || history[history.length - 1].level !== level) {
        createBadge('No lives left!', 1200, {background:'#f33',color:'#fff'});
        return;
      }
      lives--;
      resetGame();
      updateCounters();
    }
    function undoMove() {
      if (!history.length) return;
      const prev = history.pop();
      grid = prev.grid.map(r => r.slice());
      levelScore = prev.levelScore;
      render();
      updateInfo();
      updateCounters();
    }
    // Badge/Toast
    async function createBadge(text, timeMs = 1000, style = {}, position = 'center'){
      const el = document.createElement('div');
      el.className = 'badge';
      el.textContent = text;
      document.body.appendChild(el);
      requestAnimationFrame(()=>{ el.classList.add('visible'); });
      setTimeout(()=>{
        el.classList.remove('visible');
        el.addEventListener('transitionend',()=>el.remove(),{once:true});
      }, Math.max(0, timeMs));
      await sleep(Math.max(0, timeMs));
      return el;
    }
    // -- Start the game
    window.addEventListener('DOMContentLoaded', setupLevel);
  </script>
</body>
</html>
