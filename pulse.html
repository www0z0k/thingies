<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pulse Chain Puzzle — Responsive</title>
  <style>
    :root {
      /* JS updates these at runtime */
      --tile-size: 50px;          /* fallback */
      --tile-font: 18px;          /* fallback */
      --tile-value-font: 13px;    /* fallback */
      --tile-radius: 40%;
      --grid-gap: 5px;            /* keep in sync w/ #grid gap */
    }

    body {
      background: #111;
      color: #eee;
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h1 { margin-bottom: 10px; }

    #grid {
      display: grid;
      gap: var(--grid-gap);
      justify-content: center;
      margin: 20px auto;
      /* width & height set inline from JS */
    }

    .tile,
    .tile-bubble {
      width: var(--tile-size);
      height: var(--tile-size);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--tile-radius);
      font-size: var(--tile-font);
      cursor: pointer;
      user-select: none;
      position: relative;
      overflow: visible;
      margin: 0; /* grid-gap handles spacing */
      box-shadow: none;
      transition: box-shadow 0.2s, filter 0.2s, transform 0.2s;
      background: #333;
      will-change: transform, filter;
    }

    .tile-bubble.pulse,
    .tile.pulse {
      animation: popit-in 0.32s cubic-bezier(.35,1.8,.6,1.03);
    }

    @keyframes popit-in {
      0%   { transform: scale(1);   filter: brightness(1.1); }
      30%  { transform: scale(0.88); filter: brightness(1.2); }
      70%  { transform: scale(1.08); filter: brightness(1.08); }
      100% { transform: scale(1);   filter: brightness(1); }
    }

    .tile-bubble::before { display: none; }

    .value-text {
      position: absolute;
      right: calc(var(--tile-size) * 0.14);
      bottom: calc(var(--tile-size) * 0.04);
      font-size: var(--tile-value-font);
      color: #fff;
      text-shadow: 1px 1px 2px #111, 0 0 2px #000;
      pointer-events: none;
      user-select: none;
      z-index: 2;
    }

    button,
    select {
      margin-top: 10px;
      padding: 8px 16px;
      font-size: 16px;
    }

    #displayToggleLabel {
      font-size: 16px;
      margin-left: 12px;
      user-select: none;
    }

    /* --- Badge styles -------------------------------------------------- */
  .badge {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(.9);
    background: rgba(0,0,0,.8);
    color: #fff;
    padding: .5em 1.25em;
    border-radius: 999px;
    font-size: clamp(14px, 2.5vw, 24px);
    line-height: 1.2;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
    z-index: 9999;
    white-space: nowrap;
  }
  .badge.visible {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

</style>
</head>
<body>
  <h1>Pulse Chain Puzzle</h1>
  <div id="info"></div>
  <select id="mode" onchange="changeMode()">
    <option value="challenge">Challenge Mode</option>
    <option value="zen">Zen Mode</option>
  </select>
  <label id="displayToggleLabel">
    <input type="checkbox" id="displayToggle" checked onchange="render()" />
    Bubble CSS View
  </label>
  <div id="grid"></div>
  <button onclick="resetGame()">Restart Level</button>

  <script>
    function lerp(a, b, t) { return a + (b - a) * t; }
    function lerpColorRGB(stops, val) {
      // stops: [ [value, [r,g,b]], ... ] in increasing value order
      for (let i = 0; i < stops.length - 1; ++i) {
        const [v0, c0] = stops[i], [v1, c1] = stops[i+1];
        if (val >= v0 && val <= v1) {
          const t = (val - v0) / (v1 - v0);
          return [
            Math.round(lerp(c0[0], c1[0], t)),
            Math.round(lerp(c0[1], c1[1], t)),
            Math.round(lerp(c0[2], c1[2], t))
          ];
        }
      }
      // Clamp to last
      return stops[stops.length-1][1];
    }
    function getBubbleStyle(val) {
      // Spectral stops: Red -> Yellow -> Green -> Cyan -> Blue -> Purple
      const colorStops = [
        [1,   [255,0,0]],
        [20,  [255,255,0]],
        [40,  [0,255,0]],
        [60,  [0,255,255]],
        [80,  [0,0,255]],
        [100, [192,0,255]]
      ];
      const capped = Math.min(val, 100);
      const [r,g,b] = lerpColorRGB(colorStops, capped);
      const light = 76 - capped * 0.44;    // 76..32, controls "bubble" shade
      const gradEnd = 66 - capped * 0.5;
      const highlightAlpha = 0.32 - capped * 0.0012;
      return `
        background:
          radial-gradient(circle at 62% 28%, rgba(255,255,255,${highlightAlpha.toFixed(2)}) 14%, transparent ${gradEnd}%),
          radial-gradient(circle at 51% 52%, rgb(${r},${g},${b}) 68%, #181a1f 100%);
        box-shadow: 0 0 1.4px 0 rgba(${r},${g},${b},0.12);
      `;
    }
    /* --------------------------------------------------
     * Globals
     * -------------------------------------------------- */
    let grid, container, rows, cols, level = 1, totalScore = 0, levelScore = 0, mode = 'challenge';
    let initialGrid, initialScore;
    let displayMode = 'classic'; // or 'bubble'
    let pulseQueue = [];
    let history = [];

    /* Cached gap (keep in sync w/ CSS --grid-gap) */
    const GRID_GAP = 5; // px

    /* --------------------------------------------------
     * Responsive sizing
     * Grid should be ~80% of the lesser viewport dimension.
     * We fit BOTH width & height: choose the largest tile size that fits.
     * -------------------------------------------------- */
    function resizeGrid() {
      if (!container) return;
      const lesser = Math.min(window.innerWidth, window.innerHeight);
      const target = lesser * 0.7; // desired max px for the whole grid (square box)

      // available size minus total gaps
      const availW = target - GRID_GAP * (cols - 1);
      const availH = target - GRID_GAP * (rows - 1);

      // tile size limited by both width & height
      const tileSize = Math.floor(Math.min(availW / cols, availH / rows));

      // derive font sizes relative to tile
      const tileFont = Math.max(12, Math.floor(tileSize * 0.36));
      const tileValueFont = Math.max(10, Math.floor(tileSize * 0.26));

      // set CSS vars
      document.documentElement.style.setProperty('--tile-size', tileSize + 'px');
      document.documentElement.style.setProperty('--tile-font', tileFont + 'px');
      document.documentElement.style.setProperty('--tile-value-font', tileValueFont + 'px');

      // container pixel size
      const gridW = tileSize * cols + GRID_GAP * (cols - 1);
      const gridH = tileSize * rows + GRID_GAP * (rows - 1);
      container.style.width = gridW + 'px';
      container.style.height = gridH + 'px';

      // update gridTemplateColumns to match tile count (auto size)
      container.style.gridTemplateColumns = `repeat(${cols}, ${tileSize}px)`;
    }

    /* --------------------------------------------------
     * Level setup & state mgmt
     * -------------------------------------------------- */
    function setupLevel() {
      rows = cols = (mode === 'challenge' ? Math.min(4 + Math.floor(level / 3), 8) : 6);
      grid = Array.from({ length: rows }, () => Array(cols).fill(0));
      container = document.getElementById('grid');

      if (mode === 'challenge') {
        for (let i = 0; i < level + 3; i++) reverseClick();
      } else {
        randomFill(10);
      }

      levelScore = 0;
      saveInitial();
      resizeGrid();
      render();
      updateInfo();
    }

    function saveInitial() {
      initialGrid = grid.map(row => row.slice());
      initialScore = levelScore;
    }

    function restoreInitial() {
      grid = initialGrid.map(row => row.slice());
      levelScore = initialScore;
      resizeGrid();
      render();
      updateInfo();
    }

    /* --------------------------------------------------
     * Rendering
     * -------------------------------------------------- */
    function render() {
      displayMode = document.getElementById('displayToggle').checked ? 'bubble' : 'classic';
      container.innerHTML = '';
      grid.forEach((r, y) => r.forEach((val, x) => {
        const isBubble = (displayMode === 'bubble');
        const tile = document.createElement('div');
        tile.className = 'tile'//isBubble ? 'tile-bubble' : 'tile';
        tile.style.cssText = val > 0 && isBubble ? getBubbleStyle(val) : '';
        tile.dataset.x = x;
        tile.dataset.y = y;
        // tile.dataset.val = val;
        tile.onclick = () => clickTile(x, y);

        if (shouldPulse(x, y)) {
          tile.classList.add('pulse');
          setTimeout(() => tile.classList.remove('pulse'), 330);
        }

        if (isBubble) {
          if (val > 0) {
            const valText = document.createElement('div');
            valText.className = 'value-text';
            valText.textContent = val;
            tile.appendChild(valText);
          }
        } else {
          tile.textContent = val || '';
        }

        container.appendChild(tile);
      }));
      pulseQueue = [];
    }

    /* --------------------------------------------------
     * Gameplay helpers
     * -------------------------------------------------- */
    function reverseClick() {
      const x = Math.floor(Math.random() * cols), y = Math.floor(Math.random() * rows);
      grid[y][x]++;
      [[0,-1],[0,1],[-1,0],[1,0]].forEach(([dx,dy]) => {
        const nx = x + dx, ny = y + dy;
        if (inBounds(nx,ny)) grid[ny][nx]++;
      });
    }

    function randomFill(count) {
      for (let i = 0; i < count; i++) {
        const x = Math.floor(Math.random() * cols), y = Math.floor(Math.random() * rows);
        grid[y][x] = Math.min(grid[y][x] + 1, 9);
      }
    }

    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

    async function clickTile(x, y) {
      if (getVal(x,y) < 1) return;
      saveState();

      let affected = 0;
      let destroyed = 0;
      const pulses = [];
      [[0,-1],[0,1],[-1,0],[1,0]].forEach(([dx,dy]) => {
        const nx = x + dx, ny = y + dy;
        if (inBounds(nx,ny) && grid[ny][nx] > 0) {
          affected++;
          grid[ny][nx] = Math.max(0, grid[ny][nx] - 1);
          if (grid[ny][nx] === 0) destroyed++;
          pulses.push([nx, ny]);
        }
      });
      let centerPulse = false;
      if (pulses.length || grid[y][x] === 1) {
        grid[y][x] = Math.max(0, grid[y][x] - 1);
        centerPulse = true;
        
        if (grid[y][x] === 0) {
          destroyed++;
          affected++;
        }
        const moveScore = 1 + affected * (affected - 1) + destroyed * (destroyed + 1);
        
        levelScore += moveScore;
        if (mode === 'zen') {
          randomFill(Math.ceil(Math.random() * 5));
        }
        pulseQueue = [...pulses, [x, y]];
        render();
        if (moveScore > 25) {
          await createBadge(`Awesome move! +${moveScore} pts`, 500, {background:'#0a0',color:'#fff'}, 'center');
        } else if (moveScore > 16) {
          await createBadge(`Great move! +${moveScore} pts`, 500, {background:'#0a0',color:'#fff'}, 'center');
        } else if (moveScore > 10) {
          await createBadge(`Nice move! +${moveScore} pts`, 500, {background:'#0a0',color:'#fff'}, 'center');
        } else {
          await sleep(330);
        }
        checkWin();
      }
      updateInfo();
    }

    function getVal(x,y){ return inBounds(x,y) ? grid[y][x] : 0; }
    function inBounds(x,y){ return x>=0 && y>=0 && x<cols && y<rows; }

    function shouldPulse(x,y){ return pulseQueue.some(([px,py]) => px===x && py===y); }

    function checkWin() {
      if (mode === 'challenge' && grid.flat().every(v => v === 0)) {
        // const lvlScore = Math.max(0, (rows * cols) - levelScore);
        totalScore += levelScore;
        // show non-blocking badge (comment out if not wanted)
        createBadge(`Level ${level} cleared! +${levelScore} pts`, 800, {background:'#0a0',color:'#fff'}, 'center');
        setTimeout(() => {
          level++;
          setupLevel();
        }, 300);
      }
    }

    function resetGame(){ restoreInitial(); }

    function updateInfo(){
      document.getElementById('info').innerText =
        `Mode: ${mode.charAt(0).toUpperCase() + mode.slice(1)} | Level: ${level} | Score: ${levelScore} | Total Score: ${totalScore}`;
    }

    function changeMode(){
      mode = document.getElementById('mode').value;
      level = 1; totalScore = 0;
      setupLevel();
    }

    /* --------------------------------------------------
     * Undo support
     * -------------------------------------------------- */
    function saveState(){
      history.push({
        grid: grid.map(r => r.slice()),
        levelScore: levelScore
      });
      if (history.length > 200) history.shift();
    }
    function undoMove(){
      if (!history.length) return;
      const prev = history.pop();
      grid = prev.grid.map(r => r.slice());
      levelScore = prev.levelScore;
      render();
      updateInfo();
    }

    (function addUndoBtn(){
      const btn = document.createElement('button');
      btn.innerText = 'Undo';
      btn.onclick = undoMove;
      btn.style.marginLeft = '10px';
      document.body.insertBefore(btn, document.getElementById('grid'));
    })();

    /* --------------------------------------------------
     * Badges / Toasts
     * createBadge(text, timeMs=1000, style={}, position='center')
     * -------------------------------------------------- */
    async function createBadge(text, timeMs = 1000, style = {}, position = 'center'){
      const el = document.createElement('div');
      el.className = 'badge';
      el.textContent = text;

      // reset positional props
      el.style.top=''; el.style.bottom=''; el.style.left=''; el.style.right='';
      el.style.transformOrigin='center';

      switch(position){
        case 'top':
          el.style.top='15%'; el.style.left='50%'; el.style.transform='translateX(-50%) scale(.9)';
          break;
        case 'bottom':
          el.style.bottom='15%'; el.style.left='50%'; el.style.transform='translateX(-50%) scale(.9)';
          break;
        case 'top-left':
          el.style.top='10%'; el.style.left='10%'; el.style.transform='scale(.9)';
          break;
        case 'top-right':
          el.style.top='10%'; el.style.right='10%'; el.style.transform='scale(.9)';
          break;
        case 'bottom-left':
          el.style.bottom='10%'; el.style.left='10%'; el.style.transform='scale(.9)';
          break;
        case 'bottom-right':
          el.style.bottom='10%'; el.style.right='10%'; el.style.transform='scale(.9)';
          break;
        case 'center':
        default:
          el.style.top='40%'; el.style.left='50%'; el.style.transform='translate(-50%, -60%) scale(.9)';
      }

      // custom style overrides
      if (typeof style === 'string') {
        el.style.cssText += ';' + style;
      } else if (style && typeof style === 'object') {
        Object.assign(el.style, style);
      }

      document.body.appendChild(el);
      requestAnimationFrame(()=>{ el.classList.add('visible'); });

      setTimeout(()=>{
        el.classList.remove('visible');
        el.addEventListener('transitionend',()=>el.remove(),{once:true});
      }, Math.max(0, timeMs));
      await sleep(Math.max(0, timeMs));
      return el;
    }
    window.createBadge = createBadge;

    /* --------------------------------------------------
     * Event listeners
     * -------------------------------------------------- */
    window.addEventListener('resize', () => {
      resizeGrid();
    });

    // Initial boot
    setupLevel();
  </script>
</body>
</html>
